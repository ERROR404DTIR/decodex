[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "decodex"
version = "1.0.0"
description = "Decode JWTs, Base64, URL-encoding, hex and Unix timestamps. One file, zero dependencies."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
classifiers = ["License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3"]

[project.scripts]
decodex = "decodex:main"

[tool.setuptools]
py-modules = ["decodex"]
