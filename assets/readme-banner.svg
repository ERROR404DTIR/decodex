<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d"><title id="t">Decodex</title><desc id="d">Encoded strings pass through a decoder into readable data.</desc><defs><linearGradient id="bg"><stop stop-color="#18283d"/><stop offset="1" stop-color="#09111d"/></linearGradient></defs><rect width="1200" height="300" rx="24" fill="url(#bg)"/><rect x="100" y="95" width="300" height="120" rx="12" fill="#0d1b2c" stroke="#8fa8ff" stroke-width="2"/><text x="135" y="145" fill="#91a0ba" font-family="monospace" font-size="18">SGVsbG8gV29ybGQ=</text><text x="135" y="182" fill="#a89bff" font-family="monospace" font-size="13">BASE64 INPUT</text><path d="M400 155H650" stroke="#62e3c1" stroke-width="4" stroke-dasharray="10 10"><animate attributeName="stroke-dashoffset" values="0;-80" dur="2.5s" repeatCount="indefinite"/></path><rect x="680" y="95" width="330" height="120" rx="12" fill="#102b30" stroke="#62e3c1" stroke-width="2"/><text x="725" y="145" fill="#edf3ff" font-family="monospace" font-size="24">Hello World</text><text x="725" y="182" fill="#62e3c1" font-family="monospace" font-size="13">DECODED OUTPUT</text><text x="58" y="48" fill="#edf3ff" font-family="Arial,sans-serif" font-size="23" font-weight="700" letter-spacing="5">DECODEX</text><text x="1140" y="48" text-anchor="end" fill="#91a0ba" font-family="monospace" font-size="13" letter-spacing="3">BASE64 / URL / HEX / JWT</text></svg>